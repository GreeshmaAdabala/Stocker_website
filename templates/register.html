<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body{
margin:0;
font-family:Arial;
}

.container{
display:flex;
height:100vh;
}

.left{
width:50%;
}

.left img{
width:100%;
height:100%;
object-fit:cover;
}

.right{
width:50%;
display:flex;
justify-content:center;
align-items:center;
}

form{
width:320px;
}

input{
width:100%;
padding:10px;
margin:8px 0;
}

button{
width:100%;
padding:10px;
background:green;
color:white;
border:none;
}

#passwordSection{
display:none;
}
</style>

</head>

<body>

<div class="container">

<div class="left">
<img src="https://img.freepik.com/free-photo/dynamic-data-visualization-3d_23-2151904310.jpg?semt=ais_hybrid&w=740&q=80">
</div>

<div class="right">

<form method="POST" action="/register" onsubmit="return validateRegister()">



<h2>Register</h2>

<input type="text" id="username" name="username" placeholder="Username">

<input type="text" id="surname" name="surname" placeholder="Surname">

<input type="text" id="phone"  name="phone" placeholder="Phone Number">

<input type="text" id="altphone" name="altphone" placeholder="Alternate Phone (Optional)">

<input type="email" id="email"  name="email" placeholder="Email">

<button type="button" onclick="goNext()">Next</button>

<!-- PASSWORD SECTION -->

<div id="passwordSection">

<input type="password" id="password"  name='password'placeholder="Create Password">

<input type="password" id="confirm"  name='password' placeholder="Confirm Password">

<!--<button type="button" onclick="validateRegister()">Register</button>-->
<button type="submit" id="registerBtn">Register</button>



</div>

</form>

</div>
</div>

<script>

/* Regex */

let usernameRegex=/^[A-Za-z][A-Za-z0-9_]{4,15}$/;
let surnameRegex=/^[A-Za-z][A-Za-z0-9_]{4,15}$/;
let emailRegex=/^[A-Za-z][A-Za-z0-9._%+-]*@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
let phoneRegex=/^[6-9]\d{9}$/;
let passwordRegex=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6}$/;

/* STEP 1 */

function goNext(){

let username=document.getElementById("username").value.trim();
let surname=document.getElementById("surname").value.trim();
let phone=document.getElementById("phone").value.trim();
let email=document.getElementById("email").value.trim();

if(username==""||surname==""||phone==""||email==""){
alert("Fill all fields");
return;
}

if(!usernameRegex.test(username)){
alert("Invalid Username");
return;
}
/* SURNAME */
if(!surnameRegex.test(surname)){
alert("Invalid Surname");
return false;
}
/* SAME CHECK */
if(username === surname){
alert("Username and Surname must be different");
return false;
}


if(!phoneRegex.test(phone)){
alert("Invalid Phone");
return;
}

if(!emailRegex.test(email)){
alert("Invalid Email");
return;
}

/* SHOW PASSWORD */
document.getElementById("passwordSection").style.display="block";

}

/* STEP 2 */

function validateRegister(){

let password=document.getElementById("password").value.trim();
let confirm=document.getElementById("confirm").value.trim();

if(password.length != 6){
alert("Password must be exactly 6 characters");
return false;
}

if(!passwordRegex.test(password)){
alert("Password must contain Capital, Small, Number & Special");
return false;
}

if(password !== confirm){
alert("Passwords do not match");
return false;
}

// ONLY IF EVERYTHING OK
alert("Registration Successful");
return true;   // form submits ONLY here
}

</script>

</body>
</html>
