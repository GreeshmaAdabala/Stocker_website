<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    margin:0;
    font-family: Arial;
}

.container{
    display:flex;
    height:100vh;
}

.left{
    width:50%;
}

.left img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.right{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

form{
    width:300px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:10px;
    background:green;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="container">

<div class="left">
<img src="https://img.freepik.com/free-vector/user-verification-unauthorized-access-prevention-private-account-authentication-cyber-security-people-entering-login-password-safety-measures_335657-3530.jpg?semt=ais_user_personalization&w=740&q=80">
</div>

<div class="right">

<!-- IMPORTANT -->
<form method="POST" action="/login" onsubmit="return validateForm()">
    <h3>Login</h3>

<input type="text" id="username" name="username" placeholder="Username">
<input type="email" id="email" name="email" placeholder="Email">

<input type="password" id="password" name="password" placeholder="Password">

<button type="submit">Login</button>

</form>


</div>
</div>

<script>

function validateForm(){

let username=document.getElementById("username").value.trim();
let email=document.getElementById("email").value.trim();
let password=document.getElementById("password").value.trim();

let usernameRegex=/^[A-Za-z][A-Za-z0-9_]{4,15}$/;

let emailRegex=/^[A-Za-z][A-Za-z0-9._%+-]*@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;
let passwordRegex=/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{6}$/;

/* EMPTY */
if(username=="" || email=="" || password==""){
alert("All fields are mandatory");
return false;
}

/* USERNAME */
if(!usernameRegex.test(username)){
alert("Invalid Username");
return false;
}




/* EMAIL */
if(!emailRegex.test(email)){
alert("Invalid Email");
return false;
}

/* PASSWORD */
if(!passwordRegex.test(password)){
alert("Password invalid");
return false;
}

alert("Login Successful");
return true;
}

</script>

</body>
</html>
